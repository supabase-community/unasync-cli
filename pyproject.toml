[project]
name = "unasync-cli"
version = "0.0.1"
description = "Command line interface for unasync. Fork of https://github.com/leynier/unasync-cli/"
authors = [
  { name = "Leynier Gutiérrez González", email = "leynier41@gmail.com"},
]
readme = "README.md"
license = "MIT"
requires-python = ">= 3.9"
dependencies = [
  "typer >=0.4.0",
  "unasync >=0.6.0",
  "setuptools >=78.1.1",
]

[project.urls]
homepage = "https://github.com/leynier/unasync-cli"
repository = "https://github.com/leynier/unasync-cli"
documentation = "https://github.com/leynier/unasync-cli"

[project.scripts]
unasync = "unasync_cli.main:app"

[dependency-groups]
dev = [
  "pytest >= 6.2.5",
  "pytest-cov >= 3.0.0",
  "flake8 >= 7.1.1",
  "black >= 24.3",
  "isort >= 5.9.3",
  "pre-commit >= 2.15.0",
]

[tool.uv]
default-groups = [ "dev" ]

[tool.uv.build-backend]
module-name = "unasync_cli"
module-root = ""

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"
